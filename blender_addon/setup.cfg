[metadata]
name = robstride-streamer
version = 0.1.1
author = OpenAI Codex
description = Stream real-time motion setpoints from animation curves to ESP32 over Serial
url = https://github.com/yourusername/robstride-streamer
license = MIT
keywords = blender, esp32, robstride, serial, animation, streaming

[options]
packages = find:
python_requires = >=3.6
install_requires =
    pyserial>=3.5

[options.packages.find]
where = .
include = robstride_streamer*
